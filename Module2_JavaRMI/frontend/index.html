<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Room Information Service</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏢 Hostel Room Information Service</h1>
        <p class="subtitle">Module 2: Java RMI</p>
        
        <div class="form-container">
            <div class="form-group">
                <label for="roomNumber">Room Number:</label>
                <input type="text" id="roomNumber" name="roomNumber" 
                       placeholder="e.g., A-101, B-201" required>
            </div>

            <div class="button-group">
                <button id="getDetailsBtn">Get Room Details</button>
                <button id="getWardenBtn">Get Warden Contact</button>
            </div>

            <div id="result" class="result-box"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
